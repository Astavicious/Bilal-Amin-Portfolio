<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title description">
<title id="title">Musedots RFQ agent workflow</title>
<desc id="description">A single model-directed controller gathers evidence, calculates and validates a bid, reviews the portal, signs with a TAN, and confirms the receipt. Invalid candidates return to investigation; review and receipt failures return to correction, within the deadline.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147d79"/></marker></defs>
<rect width="1200" height="1600" fill="white"/>
<g font-family="Arial, sans-serif" fill="#14283e">
<text x="600" y="48" text-anchor="middle" font-size="34" font-weight="700">Musedots RFQ Agent</text>
<text x="600" y="83" text-anchor="middle" font-size="22" fill="#526579">One controller · Model-directed investigation · Explicit validation</text>

<rect x="320" y="115" width="560" height="90" rx="8" fill="#14283e" stroke="#147d79" stroke-width="2"/>
<text x="600" y="168" text-anchor="middle" font-size="25" fill="white">Load runtime brief, schema, and access</text>
<rect x="320" y="250" width="560" height="90" rx="8" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="303" text-anchor="middle" font-size="25" fill="#14283e">Qwen directs browser investigation</text>
<rect x="320" y="385" width="560" height="90" rx="8" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="422" text-anchor="middle" font-size="25" fill="#14283e">Capture sources from four websites</text>
<text x="600" y="454" text-anchor="middle" font-size="25" fill="#14283e">Preserve evidence in the notebook</text>
<rect x="320" y="520" width="560" height="90" rx="8" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="557" text-anchor="middle" font-size="25" fill="#14283e">Select materials and commercial terms</text>
<text x="600" y="589" text-anchor="middle" font-size="25" fill="#14283e">Calculate prices and delivery</text>
<path d="M600 650L900 715L600 780L300 715Z" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="707" text-anchor="middle" font-size="24" fill="#14283e">Candidate passes evidence,</text>
<text x="600" y="739" text-anchor="middle" font-size="24" fill="#14283e">schema, and calculation checks?</text>
<rect x="320" y="825" width="560" height="90" rx="8" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="878" text-anchor="middle" font-size="25" fill="#14283e">Fill portal and read the actual review</text>
<path d="M600 955L900 1020L600 1085L300 1020Z" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="1012" text-anchor="middle" font-size="24" fill="#14283e">Displayed review matches</text>
<text x="600" y="1044" text-anchor="middle" font-size="24" fill="#14283e">the validated candidate?</text>
<rect x="320" y="1130" width="560" height="90" rx="8" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="1183" text-anchor="middle" font-size="25" fill="#14283e">Retrieve TAN and sign the bid</text>
<path d="M600 1260L900 1325L600 1390L300 1325Z" fill="#e9f3f2" stroke="#147d79" stroke-width="2"/>
<text x="600" y="1333" text-anchor="middle" font-size="24" fill="#14283e">Accepted receipt confirmed?</text>
<rect x="320" y="1425" width="560" height="90" rx="8" fill="#14283e" stroke="#147d79" stroke-width="2"/>
<text x="600" y="1478" text-anchor="middle" font-size="25" fill="white">Submission confirmed</text>
<path d="M600 205V250" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 340V385" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 475V520" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 610V650" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 780V825" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 915V955" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 1085V1130" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 1220V1260" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 1390V1425" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 715H145V295H320" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900 1020H1040V870H880" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900 1325H1135V820H600V825" fill="none" stroke="#147d79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="650" y="811" font-size="20" fill="#147d79">Yes</text>
<text x="650" y="1111" font-size="20" fill="#147d79">Yes</text>
<text x="650" y="1413" font-size="20" fill="#147d79">Yes</text>
<text x="175" y="695" font-size="20" fill="#147d79">No: investigate</text>
<text x="917" y="985" font-size="20" fill="#147d79">No: correct</text>
<text x="910" y="1287" font-size="20" fill="#147d79">No: inspect / recover</text>
<text x="600" y="1565" text-anchor="middle" font-size="21" fill="#526579">Retries and correction continue only within the remaining deadline.</text>
</g></svg>